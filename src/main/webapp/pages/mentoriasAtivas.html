<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorias Ativas - Rede de Mentoria para Eventos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/global.css">

    <style>
        /* Espaço entre as abas e os cards */
        .tab-content {
            margin-top: 16px;
        }

        /* Faz os cards ocuparem a mesma altura */
        .card-mentoria {
            height: 100%;
            margin-bottom: 0;
        }

        /* Organiza o conteúdo interno do card */
        .conteudo-mentoria {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Mantém os botões na parte inferior */
        .acoes-mentoria {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
            padding-top: 16px;
        }

        /* Evita que o status seja esticado */
        .status-andamento,
        .status-concluida {
            align-self: flex-start;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* Ajustes para telas pequenas */
        @media (max-width: 576px) {
            .card-mentoria {
                padding: 20px;
            }

            .acoes-mentoria {
                flex-direction: column;
            }

            .acoes-mentoria .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-calendar-event-fill"></i>
            <br>
            Mentoria
        </div>

        <a href="../dashboard" title="Dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="../mentorias/solicitacoes" title="Solicitações Recebidas">
            <i class="bi bi-inbox-fill"></i> Solicitações Recebidas
        </a>
        <a href="../mentorias/ativas" title="Mentorias Ativas" class="active">
            <i class="bi bi-people-fill"></i> Mentorias Ativas
        </a>
        <a href="../diario" title="Diário de Bordo">
            <i class="bi bi-journal-text"></i> Diário de Bordo
        </a>
        <a href="../agenda" title="Agenda de Encontros">
            <i class="bi bi-calendar-check"></i> Agenda de Encontros
        </a>
        <a href="feedbacksRecebidos.html" title="Feedbacks Recebidos">
            <i class="bi bi-star-fill"></i> Feedbacks Recebidos
        </a>
        <a href="../perfil/mentor" title="Meu Perfil">
            <i class="bi bi-person-circle"></i> Meu Perfil
        </a>
        <a href="../logout" title="Sair">
            <i class="bi bi-box-arrow-left"></i> Sair
        </a>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="content">
        <!-- CABEÇALHO -->
        <div class="header">
            <div>
                <h2>Mentorias Ativas</h2>
                <p class="text-muted">
                    Acompanhe o andamento das mentorias em curso e finalizadas.
                </p>
            </div>

            <div class="user">
                <i class="bi bi-person-circle"></i>
                <span id="nomeMentor">Mentor(a)</span>
            </div>
        </div>

        <!-- ABAS -->
        <ul class="nav nav-tabs" id="tabsMentorias" role="tablist">
            <li class="nav-item" role="presentation">
                <button
                    class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#emAndamento"
                    type="button"
                    role="tab"
                >
                    <i class="bi bi-arrow-repeat"></i>
                    Em Andamento (<span id="contadorAndamento">0</span>)
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#concluidas"
                    type="button"
                    role="tab"
                >
                    <i class="bi bi-check-circle"></i>
                    Concluídas (<span id="contadorConcluidas">0</span>)
                </button>
            </li>
        </ul>

        <!-- CONTEÚDO DAS ABAS -->
        <div class="tab-content">
            <!-- EM ANDAMENTO -->
            <div class="tab-pane fade show active" id="emAndamento" role="tabpanel">
                <div class="row g-4" id="gridMentoriasAndamento">
                    <!-- Cards injetados dinamicamente via JS -->
                </div>
            </div>

            <!-- CONCLUÍDAS -->
            <div class="tab-pane fade" id="concluidas" role="tabpanel">
                <div class="row g-4" id="gridMentoriasConcluidas">
                    <!-- Cards injetados dinamicamente via JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
