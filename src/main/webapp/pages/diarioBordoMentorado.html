<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Bordo - Rede de Mentoria para Eventos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/diarioBordoMentorado.css">
</head>

<body>

    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-calendar-event-fill"></i>
            <br>
            Mentoria
        </div>
        <a href="../dashboard" title="Dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="../mentores" title="Encontrar Mentores">
            <i class="bi bi-search"></i> Encontrar Mentores
        </a>
        <a href="../mentorias/minhas" title="Minhas Mentorias">
            <i class="bi bi-people-fill"></i> Minhas Mentorias
        </a>
        <a href="../diario" title="Diário de Bordo" class="active">
            <i class="bi bi-journal-text"></i> Diário de Bordo
        </a>
        <a href="../agenda" title="Agenda de Encontros">
            <i class="bi bi-calendar-check"></i> Agenda de Encontros
        </a>
        <a href="feedbacksMentorado.html" title="Feedbacks">
            <i class="bi bi-star-fill"></i> Feedbacks
        </a>
        <a href="../perfil/mentorado" title="Meu Perfil">
            <i class="bi bi-person-circle"></i> Meu Perfil
        </a>
        <a href="../logout" title="Sair">
            <i class="bi bi-box-arrow-left"></i> Sair
        </a>
    </div>

    <div class="content">
        <div class="header">
            <div>
                <h2>Diário de Bordo</h2>
                <p class="text-muted">Acompanhe os registros da sua mentoria e escreva suas próprias reflexões.</p>
            </div>
            <div class="user">
                <i class="bi bi-person-circle"></i>
                <span id="nomeUsuario">Mentorado(a)</span>
            </div>
        </div>

        <!-- SELECIONAR MENTORIA -->
        <div class="box-select">
            <label class="form-label fw-semibold" for="selectMentoria">Selecione a Mentoria</label>
            <select class="form-select" id="selectMentoria">
                <option value="">Selecione uma mentoria...</option>
                <!-- Opções dinâmicas -->
            </select>
        </div>

        <!-- NOVA REFLEXÃO -->
        <div class="box-form">
            <h5 class="mb-3">
                <i class="bi bi-journal-plus text-success"></i> Minha Reflexão sobre o Encontro
            </h5>
            <form id="formNovaReflexao">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="encontroRelacionado">Encontro relacionado</label>
                        <select class="form-select" id="encontroRelacionado" required>
                            <option value="">Selecione o encontro...</option>
                            <option value="livre">Registro livre (sem encontro)</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="dataRegistro">Data do registro</label>
                        <input type="date" class="form-control" id="dataRegistro" style="border-radius:12px;height:48px;" required>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label fw-semibold" for="aprendizado">O que aprendi</label>
                        <textarea class="form-control" id="aprendizado" placeholder="Descreva o que você aprendeu com este encontro..." required></textarea>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label fw-semibold" for="duvidas">Dúvidas que ainda tenho</label>
                        <textarea class="form-control" id="duvidas" placeholder="O que ainda não ficou claro ou você quer aprofundar?"></textarea>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-save2"></i> Salvar Reflexão
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- HISTÓRICO -->
        <h5 class="mb-3">Histórico Completo</h5>
        <div class="timeline" id="historicoTimeline">
            <!-- Entradas injetadas dinamicamente -->
        </div>
    </div>

</body>

</html>
