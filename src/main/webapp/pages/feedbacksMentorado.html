<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedbacks - Rede de Mentoria para Eventos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/feedbacksMentorado.css">
</head>

<body>

    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-calendar-event-fill"></i>
            <br>
            Mentoria
        </div>
        <a href="../dashboard" title="Dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="../mentores" title="Encontrar Mentores">
            <i class="bi bi-search"></i> Encontrar Mentores
        </a>
        <a href="../mentorias/minhas" title="Minhas Mentorias">
            <i class="bi bi-people-fill"></i> Minhas Mentorias
        </a>
        <a href="../diario" title="Diário de Bordo">
            <i class="bi bi-journal-text"></i> Diário de Bordo
        </a>
        <a href="../agenda" title="Agenda de Encontros">
            <i class="bi bi-calendar-check"></i> Agenda de Encontros
        </a>
        <a href="feedbacksMentorado.html" title="Feedbacks" class="active">
            <i class="bi bi-star-fill"></i> Feedbacks
        </a>
        <a href="../perfil/mentorado" title="Meu Perfil">
            <i class="bi bi-person-circle"></i> Meu Perfil
        </a>
        <a href="../logout" title="Sair">
            <i class="bi bi-box-arrow-left"></i> Sair
        </a>
    </div>

    <div class="content">
        <div class="header">
            <div>
                <h2>Feedbacks</h2>
                <p class="text-muted">Avalie seus mentores e acompanhe seu histórico de feedbacks.</p>
            </div>
            <div class="user">
                <i class="bi bi-person-circle"></i>
                <span id="nomeUsuario">Mentorado(a)</span>
            </div>
        </div>

        <!-- MENTORIA PENDENTE DE AVALIAÇÃO -->
        <div class="box-pendente d-none" id="boxPendenteAvaliacao">
            <div>
                <h5 class="mb-1">
                    <i class="bi bi-star-fill"></i>
                    Você tem mentorias concluídas aguardando avaliação
                </h5>
                <p class="mb-0" id="textoMentoriaPendente"></p>
            </div>
            <button class="btn" data-bs-toggle="modal" data-bs-target="#modalAvaliar">
                Avaliar Agora
            </button>
        </div>

        <!-- HISTÓRICO DE FEEDBACKS ENVIADOS -->
        <div class="box">
            <h5 class="mb-3">Meus Feedbacks Enviados</h5>
            <div id="listaFeedbacksEnviados">
                <!-- Cards de feedback enviados dinamicamente -->
            </div>
        </div>
    </div>

    <!-- MODAL AVALIAR -->
    <div class="modal fade" id="modalAvaliar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-success" id="tituloModalAvaliar">
                        <i class="bi bi-star-fill"></i> Avaliar Mentor
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form id="formAvaliacao">
                        <input type="hidden" id="mentoriaIdAvaliacao" name="mentoriaId">
                        <div class="text-center mb-3 estrelas-input" id="estrelasInputContainer">
                            <i class="bi bi-star" data-valor="1"></i>
                            <i class="bi bi-star" data-valor="2"></i>
                            <i class="bi bi-star" data-valor="3"></i>
                            <i class="bi bi-star" data-valor="4"></i>
                            <i class="bi bi-star" data-valor="5"></i>
                        </div>
                        <input type="hidden" id="notaAvaliacao" name="nota" required>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="depoimentoMentoria">Depoimento</label>
                            <textarea class="form-control" id="depoimentoMentoria" style="height:120px;" placeholder="Conte como foi sua experiência com este mentor..." required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-success" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formAvaliacao" class="btn btn-success">
                        <i class="bi bi-send-check-fill"></i> Enviar Avaliação
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
