<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Mentorias - Rede de Mentoria para Eventos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/global.css">

    <style>
        .tab-content {
            margin-top: 16px;
        }
        .card-mentoria {
            height: 100%;
            margin-bottom: 0;
        }
        .card-mentoria .row {
            min-width: 0;
        }
        .acoes-mentoria {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        @media (max-width: 576px) {
            .card-mentoria {
                padding: 20px;
            }
            .avatar-lg {
                margin-bottom: 10px;
            }
            .acoes-mentoria .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-calendar-event-fill"></i>
            <br>
            Mentoria
        </div>

        <a href="dashboardMentorado.html" title="Dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="encontrarMentores.html" title="Encontrar Mentores">
            <i class="bi bi-search"></i> Encontrar Mentores
        </a>
        <a href="solicitarMentoria.html" title="Solicitar Mentoria">
            <i class="bi bi-send-plus-fill"></i> Solicitar Mentoria
        </a>
        <a href="minhasMentorias.html" title="Minhas Mentorias" class="active">
            <i class="bi bi-people-fill"></i> Minhas Mentorias
        </a>
        <a href="diarioBordoMentorado.html" title="Diário de Bordo">
            <i class="bi bi-journal-text"></i> Diário de Bordo
        </a>
        <a href="agendaEncontrosMentorado.html" title="Agenda de Encontros">
            <i class="bi bi-calendar-check"></i> Agenda de Encontros
        </a>
        <a href="feedbacksMentorado.html" title="Feedbacks">
            <i class="bi bi-star-fill"></i> Feedbacks
        </a>
        <a href="meuPerfilMentorado.html" title="Meu Perfil">
            <i class="bi bi-person-circle"></i> Meu Perfil
        </a>
        <a href="login.html" title="Sair">
            <i class="bi bi-box-arrow-left"></i> Sair
        </a>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="content">
        <div class="header">
            <div>
                <h2>Minhas Mentorias</h2>
                <p class="text-muted">
                    Acompanhe suas mentorias em andamento, pendentes e concluídas.
                </p>
            </div>
            <div class="user">
                <i class="bi bi-person-circle"></i>
                <span id="nomeMentorado">Mentorado(a)</span>
            </div>
        </div>

        <!-- ABAS -->
        <ul class="nav nav-tabs" id="tabsMentorias" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#emAndamento" type="button" role="tab">
                    <i class="bi bi-arrow-repeat"></i> Em Andamento (<span id="contadorAndamento">0</span>)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pendentes" type="button" role="tab">
                    <i class="bi bi-clock-fill"></i> Pendentes (<span id="contadorPendentes">0</span>)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#concluidas" type="button" role="tab">
                    <i class="bi bi-check-circle"></i> Concluídas (<span id="contadorConcluidas">0</span>)
                </button>
            </li>
        </ul>

        <!-- CONTEÚDO DAS ABAS -->
        <div class="tab-content">
            <!-- EM ANDAMENTO -->
            <div class="tab-pane fade show active" id="emAndamento" role="tabpanel">
                <div class="row g-4" id="gridMentoriasAndamento">
                    <!-- Cards injetados via JS -->
                </div>
            </div>

            <!-- PENDENTES -->
            <div class="tab-pane fade" id="pendentes" role="tabpanel">
                <div class="row g-4" id="gridMentoriasPendentes">
                    <!-- Cards injetados via JS -->
                </div>
            </div>

            <!-- CONCLUÍDAS -->
            <div class="tab-pane fade" id="concluidas" role="tabpanel">
                <div class="row g-4" id="gridMentoriasConcluidas">
                    <!-- Cards injetados via JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
