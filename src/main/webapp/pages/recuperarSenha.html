<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Rede de Mentoria para Eventos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
</head>

<body style="background: linear-gradient(135deg, #1B5E20, #4CAF50); height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 40px; border-radius: 20px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
        <h4 class="text-center mb-3" style="color: #2E7D32;">Recuperação de Senha</h4>
        <p class="text-muted text-center mb-4">Informe seu email cadastrado para receber as instruções de redefinição.</p>

        <form id="formRecuperarSenha">
            <div class="mb-3">
                <label for="emailRecuperacao" class="form-label fw-semibold">Email cadastrado</label>
                <input type="email" class="form-control" id="emailRecuperacao" name="email" placeholder="nome@email.com" required>
            </div>

            <button type="submit" class="btn btn-success w-100 mb-3">
                Enviar link de recuperação
            </button>
        </form>

        <div class="text-center">
            <a href="login.html" class="text-success text-decoration-none small">Voltar ao login</a>
        </div>
    </div>
</body>

</html>
