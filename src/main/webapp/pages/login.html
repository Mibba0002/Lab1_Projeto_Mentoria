<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rede de Mentoria para Eventos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/login.css">

</head>

<body class="pagina-auth">

    <div class="login-card">

        <div class="logo">

            <i class="bi bi-calendar-event-fill"></i>

        </div>

        <h2>Rede de Mentoria</h2>

        <p>Conectando profissionais e estudantes da área de eventos.</p>

        

        <div id="mensagemLogin" class="alert d-none" role="alert"></div>

        <form action="../login" method="post">

            <div class="mb-3">

                <label>Email</label>

                <input type="email" name="email" id="emailLogin" class="form-control" placeholder="Digite seu email" required>

            </div>

            <div class="mb-3">

                <label>Senha</label>

                <div class="input-group">
                    <input type="password" name="senha" id="campoSenha" class="form-control" placeholder="Digite sua senha" required>
                    <span class="input-group-text toggle-senha" onclick="alternarSenha()">
                        <i class="bi bi-eye-fill" id="iconeSenha"></i>
                    </span>
                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="lembrarMe">
                    <label class="form-check-label esqueci-senha" for="lembrarMe">
                        Lembrar-me
                    </label>
                </div>

                <a href="recuperarSenha.html" class="esqueci-senha">Esqueci minha senha</a>

            </div>

            <button class="btn-login" type="submit">

                <i class="bi bi-box-arrow-in-right"></i>

                Entrar

            </button>

        </form>

        <div class="text-center mt-3">

            <small>

                Não possui conta?

                <a href="escolhaCadastro.html">

                    Cadastre-se

                </a>

            </small>

        </div>

    </div>

    <script>

    function alternarSenha(){

        const campo = document.getElementById('campoSenha');
        const icone = document.getElementById('iconeSenha');

        if(campo.type === 'password'){
            campo.type = 'text';
            icone.classList.remove('bi-eye-fill');
            icone.classList.add('bi-eye-slash-fill');
        }else{
            campo.type = 'password';
            icone.classList.remove('bi-eye-slash-fill');
            icone.classList.add('bi-eye-fill');
        }

    }

    const parametros = new URLSearchParams(window.location.search);
    const mensagem = document.getElementById('mensagemLogin');
    const formularioLogin = document.querySelector('form[action="../login"]');
    const campoEmail = document.getElementById('emailLogin');
    const lembrarMe = document.getElementById('lembrarMe');
    const emailLembrado = localStorage.getItem('miracleLoginEmail');

    if (emailLembrado) {
        campoEmail.value = emailLembrado;
        lembrarMe.checked = true;
    }

    formularioLogin.addEventListener('submit', function () {
        if (lembrarMe.checked) {
            localStorage.setItem('miracleLoginEmail', campoEmail.value.trim());
        } else {
            localStorage.removeItem('miracleLoginEmail');
        }
    });

    if (parametros.get('erro') === 'credenciais') {
        mensagem.textContent = 'E-mail ou senha inválidos, ou conta inativa.';
        mensagem.classList.add('alert-danger');
        mensagem.classList.remove('d-none');
    } else if (parametros.get('cadastro') === 'sucesso') {
        mensagem.textContent = 'Cadastro realizado. Agora você já pode entrar.';
        mensagem.classList.add('alert-success');
        mensagem.classList.remove('d-none');
    }

    </script>

</body>

</html>
